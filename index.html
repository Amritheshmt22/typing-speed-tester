<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Speed Tester</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Frontend practice project</p>
      <h1 id="page-title">Typing Speed Tester</h1>
      <p class="intro">Test your typing speed and accuracy with a short practice quote. Your best score is saved in this browser.</p>
    </section>

    <section class="test-card" aria-label="Typing test">
      <div class="toolbar">
        <button id="startButton" class="primary-button" type="button">Start test</button>
        <button id="resetButton" class="secondary-button" type="button">Reset</button>
      </div>

      <div class="quote-panel">
        <span class="panel-label">Quote</span>
        <p id="quoteText">Press Start test to load a quote.</p>
      </div>

      <label class="input-label" for="typingInput">Type the quote here</label>
      <textarea id="typingInput" rows="5" placeholder="The typing area opens when the test starts." disabled></textarea>

      <div class="progress-wrap" aria-label="Completion progress">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div class="stats-grid" aria-live="polite">
        <article class="stat-card">
          <span class="stat-label">Time</span>
          <strong id="timeStat">0.0s</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">Speed</span>
          <strong id="wpmStat">0 WPM</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">Accuracy</span>
          <strong id="accuracyStat">100%</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">Best</span>
          <strong id="bestStat">0 WPM</strong>
        </article>
      </div>

      <p id="statusMessage" class="status-message">Ready when you are.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
